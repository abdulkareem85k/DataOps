[project]
name = "vapt-agent-backend"
version = "0.1.0"
description = "Safety-first FastAPI foundation for the AI Unified VAPT Agent"
requires-python = ">=3.11,<3.12"
dependencies = [
  "defusedxml>=0.7.1",
  "fastapi>=0.115.12,<1.0",
  "pydantic-settings>=2.9.1,<3.0",
  "python-multipart>=0.0.33",
  "SQLAlchemy>=2.0.40,<3.0",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1.0",
  "pytest>=8.3.5,<9.0",
  "PyYAML>=6.0.2,<7.0",
  "ruff>=0.11.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
