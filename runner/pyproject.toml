[project]
name = "vapt-scanner-runner"
version = "0.1.0"
description = "Restricted lab-only Nmap and Nikto runner API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.12,<1.0",
  "pydantic-settings>=2.9.1,<3.0",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1.0",
  "pytest>=8.3.5,<9.0",
  "ruff>=0.11.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
